{% extends 'base.html' %}

{% block title %}Create Account{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-5 col-md-7">

        <div class="card shadow-lg border-0 mt-5">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <i class="bi bi-bag-heart-fill text-danger display-3"></i>

                    <h2 class="fw-bold mt-3">
                        Create Your Account
                    </h2>

                    <p class="text-muted">
                        Join ShopHub and start shopping today
                    </p>

                </div>
                {% if error %}

                <div class="alert alert-danger">

                    {{ error }}

                </div>

                {% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Username
                        </label>

                        <input type="text" name="username" class="form-control form-control-lg"
                            placeholder="Enter username" required>

                    </div>
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Email Address
                        </label>

                        <input type="email" name="email" class="form-control form-control-lg"
                            placeholder="Enter your email" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <input type="password" name="password1" class="form-control form-control-lg"
                            placeholder="Create password" required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Confirm Password
                        </label>

                        <input type="password" name="password2" class="form-control form-control-lg"
                            placeholder="Confirm password" required>

                    </div>

                    <button type="submit" class="btn btn-warning btn-lg w-100">

                        <i class="bi bi-person-plus-fill"></i>

                        Create Account

                    </button>

                </form>

                <hr>

                <div class="text-center">

                    Already have an account?

                    <a href="{% url 'login' %}" class="fw-bold text-decoration-none">

                        Login Here

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
