{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow-lg border-0 mt-5">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <i class="bi bi-person-circle display-1 text-primary"></i>

                    <h2>Welcome Back</h2>

                    <p class="text-muted">
                        Login to continue shopping
                    </p>

                </div>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-warning btn-lg w-100">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Login

                    </button>

                </form>

                <hr>

                <div class="text-center">

                    Don't have an account?

                    <a href="{% url 'register' %}">
                        Register Here
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
